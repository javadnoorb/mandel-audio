[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mandel-audio"
version = "0.3.0"
description = "A fractal zoom video renderer that reacts to music."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "numba>=0.58",
    "matplotlib>=3.7",
    "soundfile>=0.12",
    "imageio>=2.31",
    "imageio-ffmpeg>=0.4",
    "librosa>=0.10",
    "mpmath>=1.3",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
]

[project.scripts]
mandel-audio = "mandel_audio.cli:main"

[tool.setuptools.packages.find]
include = ["mandel_audio*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
